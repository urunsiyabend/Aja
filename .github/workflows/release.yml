name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  SIYO_VERSION: 0.7.0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify the tag matches siyo.toml
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MANIFEST=$(grep -E '^version[[:space:]]*=' siyo.toml | head -1 | cut -d'"' -f2)
          if [ "$VERSION" != "$MANIFEST" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match siyo.toml version ${MANIFEST}" >&2
            exit 1
          fi

      - name: Install Siyo ${{ env.SIYO_VERSION }}
        run: |
          curl -fsSL -o siyo.tar.gz \
            "https://github.com/urunsiyabend/SiyoCompiler/releases/download/v${SIYO_VERSION}/siyo-${SIYO_VERSION}-linux-x64.tar.gz"
          tar xzf siyo.tar.gz
          echo "$PWD/siyo-${SIYO_VERSION}-linux-x64/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify browser search
        run: node scripts/search_test.mjs

      - name: Verify the release candidate
        run: |
          python3 scripts/verify.py
          ./aja check
          ./aja build

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Take the section for this version, stopping at the next "## " heading.
          awk -v v="## ${VERSION}" '
            index($0, v) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf 'Aja %s\n' "$VERSION" > release-notes.md
          fi
          cat release-notes.md

      - name: Package the source tree
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git archive --format=tar.gz --prefix="aja-${VERSION}/" -o "aja-${VERSION}.tar.gz" HEAD
          sha256sum "aja-${VERSION}.tar.gz" > SHA256SUMS

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: Aja ${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: 'true'
          fail_on_unmatched_files: true
          body_path: release-notes.md
          files: |
            aja-${{ steps.version.outputs.version }}.tar.gz
            SHA256SUMS
