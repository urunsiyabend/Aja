<article class="prose">
  <header class="article-header">
    <p class="eyebrow">Post</p>
    <h1>{{title}}</h1>
    <p class="byline"><time datetime="{{date}}">{{date}}</time> · {{site_author}}</p>
    {{tags}}
  </header>
  {{content}}
  <footer class="article-footer">
    <a class="back-link" href="/">← All posts</a>
  </footer>
</article>
